{% extends "base.html" %}

{% block content %}

<!-- US8.1 Confirmation overlay -->
<div id="confirmOverlay" class="overlay">
  <div class="overlay-card">
    <div class="check">✔</div>
    <div class="msg">Evaluation saved successfully.</div>
  </div>
</div>

<section class="eval-wrapper">
  <div class="eval-card">

    <!-- US7.1 -->
    <h1 class="project-title">{{ project.name }}</h1>

    <!-- US7.2 + US7.3 + US7.4 -->
    <form id="evalForm" method="post"
          action="{{ url_for('submit_evaluation', project_id=project.id) }}">

      <div class="field">
        <label>Innovation (1–10): <span id="innovation_val">5</span></label>
        <input type="range" id="innovation" name="innovation"
               min="1" max="10" value="5" required
               oninput="innovation_val.textContent=this.value;">
      </div>

      <div class="field">
        <label>Clarity (1–10): <span id="clarity_val">5</span></label>
        <input type="range" id="clarity" name="clarity"
               min="1" max="10" value="5" required
               oninput="clarity_val.textContent=this.value;">
      </div>

      <div class="field">
        <label>Completeness (1–10): <span id="completeness_val">5</span></label>
        <input type="range" id="completeness" name="completeness"
               min="1" max="10" value="5" required
               oninput="completeness_val.textContent=this.value;">
      </div>

      <!-- US7.3 -->
      <div class="field">
        <label>Comments (max 500 chars)</label>
        <textarea id="comments" name="comments" maxlength="500"
                  placeholder="Write your feedback..."></textarea>
      </div>

      <!-- US7.4 + US8.3 -->
      <button id="submitBtn" class="btn primary full" type="submit" disabled>
        Submit Evaluation
      </button>
    </form>
  </div>
</section>

<!-- ================= STYLES ================= -->
<style>
.eval-wrapper {
  min-height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.eval-card {
  width: 100%;
  max-width: 600px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 18px;
  padding: 32px;
  backdrop-filter: blur(14px);
}

.project-title {
  text-align: center;
  font-size: 28px;
  margin-bottom: 25px;
}

.field {
  margin-bottom: 22px;
}

.field label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  color: #ddd;
}

input[type="range"] {
  width: 100%;
}

textarea {
  width: 100%;
  min-height: 120px;
  resize: none;
  border-radius: 10px;
  padding: 12px;
  border: none;
  background: rgba(0,0,0,0.35);
  color: #fff;
}

.btn.full {
  width: 100%;
  padding: 14px;
  font-size: 16px;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Overlay */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 9999;
  align-items: center;
  justify-content: center;
}

.overlay-card {
  background: #0f172a;
  border-radius: 18px;
  padding: 36px 44px;
  text-align: center;
  color: white;
}

.check {
  font-size: 72px;
  color: #22c55e;
}

.msg {
  margin-top: 14px;
  font-size: 18px;
  font-weight: 600;
}
</style>

<!-- ================= SCRIPT (UNCHANGED LOGIC) ================= -->
<script>
const form = document.getElementById("evalForm");
const overlay = document.getElementById("confirmOverlay");

const innovation = document.getElementById("innovation");
const clarity = document.getElementById("clarity");
const completeness = document.getElementById("completeness");
const submitBtn = document.getElementById("submitBtn");

let touchedInnovation = false;
let touchedClarity = false;
let touchedCompleteness = false;

function updateSubmitState() {
  submitBtn.disabled = !(touchedInnovation && touchedClarity && touchedCompleteness);
}

innovation.addEventListener("input", () => {
  touchedInnovation = true;
  updateSubmitState();
});
clarity.addEventListener("input", () => {
  touchedClarity = true;
  updateSubmitState();
});
completeness.addEventListener("input", () => {
  touchedCompleteness = true;
  updateSubmitState();
});

form.addEventListener("submit", (e) => {
  e.preventDefault(); // stop immediate submit

  overlay.style.display = "flex";
  submitBtn.disabled = true;

  // control how long the message stays visible
  setTimeout(() => {
    form.submit(); // submit after delay
  }, 2000); // 2000 ms = 2 seconds
});

</script>

{% endblock %}
