{% extends "base.html" %}

{% set title = "Login - SmartEval" %}
{% set page_css = "login.css" %}

{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <h1 class="auth-title">Login</h1>
    <p class="auth-subtitle">Welcome back. Please sign in.</p>

    <form method="post" class="auth-form" action="{{ url_for('login') }}">
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="name@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        >
      </div>

      <div class="auth-actions">
        <button class="btn-primary" type="submit">Login</button>
      </div>
    </form>

    <div class="auth-footer">
      No account? <a href="{{ url_for('register') }}">Register</a>
    </div>
  </div>
</section>
{% endblock %}
